# Builds the installers on each operating system and, for version tags, attaches them to a
# draft GitHub release. Run it manually from the Actions tab to just get the build artifacts.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history, to check that a release commit is on main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Installers carry the package version, and only reviewed code may be released.
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$GITHUB_REF_NAME" in
            "v$version.alpha") ;;
            "v$version")
              if [ "$REPO_PRIVATE" = "true" ]; then
                echo "::error::Production installers need a build attestation, which requires a public repository. Make it public first, or use a v$version.alpha tag."
                exit 1
              fi
              ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version or v$version.alpha)."
              exit 1
              ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    # id-token and attestations: signing the build provenance of release installers.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run dist:${{ matrix.target }}
      # A signed record that each installer was built by this workflow from this commit. Anyone can
      # check a download with: gh attestation verify <file> --repo <owner>/<repo>
      # GitHub offers this to public repositories on this plan. While private, only alpha tags get
      # here: the check job refuses production tags.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Kept one day: the release job uses them right away, and private repositories have little
      # artifact storage (the installers of one build are about 1.5 GB).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: |
            dist/*
            !dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --draft --generate-notes ${{ endsWith(github.ref_name, '.alpha') && '--prerelease' || '' }}
          --title "XRP Wallet $GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
